<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Business</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #2e8b57;
        --accent-dark: #236c42;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .card {
        width: min(90vw, 520px);
        background: var(--panel);
        border-radius: 16px;
        padding: 48px 32px;
        box-shadow: 0 10px 25px rgba(31, 41, 55, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 2.8rem);
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1rem;
      }

      button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--accent-dark);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>My Business Name</h1>
      <p>
        Welcome to my business. We provide thoughtful services and practical solutions
        designed to help you move forward with confidence.
      </p>
      <p>
        We sell high-quality products and tailored solutions that make everyday life
        easier, more enjoyable, and more efficient for our customers.
      </p>
      <button onclick="alert('It works!')">Click Me</button>
    </main>
  </body>
</html>
